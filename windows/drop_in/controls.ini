# Saros keyboard and mouse controls for the default in-game controller layout.
# The Windows launcher shows a pointer in menus and captures the mouse for aiming during play.
# If SAROS_MENU_CURSOR is disabled, F7 or middle-click switches between aiming and menu focus.
# Alt-Tab releases the mouse.
# F1 applies edits while the game is running.

LeftStickUp = KEY:W
LeftStickLeft = KEY:A
LeftStickDown = KEY:S
LeftStickRight = KEY:D
StickModifier = KEY:Left Alt
RightStickUp = KEY:Keypad 8
RightStickLeft = KEY:Keypad 4
RightStickDown = KEY:Keypad 2
RightStickRight = KEY:Keypad 6
ToggleMouse = KEY:F7
ToggleMouse = MOUSE:Middle
MouseStickTarget = Right
MouseSensitivity = 1
MouseDecayMs = 75

# Fire, shield/melee, and the power weapon.
R2 = MOUSE:Left
R1 = MOUSE:Right
R1 = KEY:Q
L2 = KEY:Left Ctrl
L2 = MOUSE:X1

# Jump/confirm, back, interact, and secondary interact.
Cross = KEY:Space
Cross = KEY:Return
Circle = KEY:C
Triangle = KEY:E
Square = KEY:F

# Dash/sprint, reload, overdrive, and scan.
L1 = KEY:Left Shift
R3 = KEY:R
L3 = KEY:V
R3 = KEY:V
Down = KEY:Down
Down = KEY:Z

TouchRight = KEY:Tab
Options = KEY:Escape
